services:
  postgres:
    image: postgres:16-alpine
    container_name: neostream-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neostream
    ports:
      - "5432:5432"
    volumes:
      - neostream_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neostream"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neostream_pgdata:
